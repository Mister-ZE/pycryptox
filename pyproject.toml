[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycryptox"
version = "1.0.0"
description = "Post-quantum cryptography library with built-in plausible deniability."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mister Z"},
]
keywords = ["cryptography", "post-quantum", "encryption", "deniability", "ml-kem", "kyber"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "rapidfuzz>=3.0",
]

[project.urls]
Documentation = "https://github.com/Mister-ZE/pycryptox/blob/main/pycryptox/documentation/en/INDEX.md"
Repository = "https://github.com/Mister-ZE/pycryptox"
Issues = "https://github.com/Mister-ZE/pycryptox/issues"

[tool.setuptools]
packages = [
    "pycryptox",
    "pycryptox._colorx",
    "pycryptox._keyx",
    "pycryptox._keyx.bluekeys",
    "pycryptox._exceptions",
]

[tool.setuptools.package-data]
"pycryptox" = [
    "_assets/words.txt",
    "CREDITS.md",
    "README.md",
]
